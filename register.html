<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register – IngreCheck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-badge">IC</span><span class="brand-name">IngreCheck</span>
      </a>
      <div class="nav-actions" data-nav-user></div>
    </div>
  </nav>

  <main class="container">
    <div class="row row-2">
      <form id="register-form" class="card p-4">
        <h2>Create your account</h2>

        <label class="mt-3">Full Name
          <input class="input" id="name" required>
        </label>

        <label class="mt-3">Email / Username
          <input class="input" id="email" type="email" required>
        </label>

        <label class="mt-3">Password
          <input class="input" id="password" type="password" required minlength="4">
        </label>

        <div class="mt-3">
          <div class="mb-2">Permanent Health Issues (select any)</div>
          <div id="issues-box" class="row row-2"></div>
        </div>

        <button class="btn btn-primary mt-4" type="submit">Register</button>
        <div class="mt-2 helper">Already have an account? <a class="link" href="login.html">Login</a></div>
      </form>

      <div class="card p-4">
        <h3>Why register?</h3>
        <p>We personalize warnings based on your health profile to keep you safer.</p>
      </div>
    </div>
  </main>

  <footer class="footer">© <span class="brand-name">IngreCheck</span></footer>
  <script src="app.js"></script>
</body>
</html>
