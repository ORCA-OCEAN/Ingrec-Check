<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>History – IngreCheck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-badge">IC</span><span class="brand-name">IngreCheck</span>
      </a>
      <div class="nav-actions" data-nav-user></div>
    </div>
  </nav>

  <main class="container">
    <div class="card p-4">
      <h2>Scan History</h2>
      <table class="table mt-3">
        <thead>
          <tr>
            <th>Product</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="history-rows"></tbody>
      </table>
    </div>
  </main>

  <footer class="footer">© <span class="brand-name">IngreCheck</span></footer>
  <script src="app.js"></script>
</body>
</html>
