<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login – IngreCheck</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-badge">IC</span><span class="brand-name">IngreCheck</span>
      </a>
      <div class="nav-actions" data-nav-user></div>
    </div>
  </nav>

  <main class="container">
    <div class="row row-2">
      <form id="login-form" class="card p-4">
        <h2>Welcome back</h2>
        <label class="mt-3">Email
          <input class="input" id="email" type="email" required>
        </label>
        <label class="mt-3">Password
          <input class="input" id="password" type="password" required>
        </label>
        <button class="btn btn-dark mt-4" type="submit">Login</button>
        <div class="mt-2"><a class="link" href="register.html">New here? Sign up</a></div>
      </form>

      <div class="card p-4">
        <h3>Forgot Password?</h3>
        <p>Implement email OTP or reset flow in backend later.</p>
      </div>
    </div>
  </main>

  <footer class="footer">© <span class="brand-name">IngreCheck</span></footer>
  <script src="app.js"></script>
</body>
</html>
